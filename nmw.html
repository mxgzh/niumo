<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>牛魔王骑自行车</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: linear-gradient(180deg, #cfe8ff 0%, #eaf6ff 100%);
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
  }
  .card {
    background: #ffffff;
    border-radius: 20px;
    box-shadow: 0 10px 30px rgba(50, 80, 120, .18);
    padding: 24px;
    margin: 24px;
    width: min(900px, 94vw);
  }
  h1 {
    text-align: center;
    font-size: 22px;
    color: #2c3e50;
    margin: 0 0 12px;
  }
  svg { display: block; width: 100%; height: auto; border-radius: 12px; }
</style>
</head>
<body>
<div class="card">
  <h1>牛魔王骑自行车</h1>
  <svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
    <!-- 天空背景 -->
    <rect x="0" y="0" width="800" height="500" fill="#bfe3ff"/>
    <rect x="0" y="0" width="800" height="500" fill="url(#skyGrad)"/>
    <defs>
      <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#a8dcff"/>
        <stop offset="1" stop-color="#e6f5ff"/>
      </linearGradient>
    </defs>

    <!-- 太阳 -->
    <circle cx="710" cy="80" r="48" fill="#fff3b0" opacity=".7"/>
    <circle cx="710" cy="80" r="36" fill="#ffd166"/>

    <!-- 云 -->
    <g fill="#ffffff" opacity=".9">
      <ellipse cx="150" cy="80" rx="46" ry="18"/>
      <ellipse cx="185" cy="68" rx="30" ry="15"/>
      <ellipse cx="120" cy="70" rx="26" ry="13"/>
      <ellipse cx="560" cy="55" rx="40" ry="16"/>
      <ellipse cx="590" cy="45" rx="26" ry="13"/>
    </g>
    <!-- 小鸟 -->
    <g stroke="#4a5a6a" stroke-width="2.5" fill="none" stroke-linecap="round">
      <path d="M300 110 q10 -9 20 0 q10 -9 20 0"/>
      <path d="M360 130 q8 -7 16 0 q8 -7 16 0"/>
    </g>

    <!-- 树 -->
    <g>
      <rect x="118" y="352" width="14" height="78" fill="#7a5230"/>
      <circle cx="125" cy="330" r="42" fill="#3fa66a"/>
      <circle cx="95" cy="352" r="30" fill="#48b576"/>
      <circle cx="158" cy="350" r="30" fill="#48b576"/>
      <rect x="628" y="368" width="12" height="62" fill="#7a5230"/>
      <circle cx="634" cy="350" r="36" fill="#3fa66a"/>
      <circle cx="662" cy="368" r="24" fill="#48b576"/>
    </g>

    <!-- 草地与公路 -->
    <rect x="0" y="424" width="800" height="14" fill="#4caf6d"/>
    <rect x="0" y="438" width="800" height="62" fill="#6e6e78"/>
    <line x1="0" y1="468" x2="800" y2="468" stroke="#f4f4f4" stroke-width="6"
          stroke-dasharray="45 55" stroke-linecap="round">
      <animate attributeName="stroke-dashoffset" from="0" to="100" dur="0.5s" repeatCount="indefinite"/>
    </line>

    <!-- 速度线 -->
    <g stroke="#8fa8bd" stroke-width="5" stroke-linecap="round" opacity=".7">
      <line x1="120" y1="220" x2="210" y2="220"/>
      <line x1="100" y1="255" x2="190" y2="255"/>
      <line x1="130" y1="290" x2="215" y2="290"/>
      <animate attributeName="opacity" values=".7;.25;.7" dur=".8s" repeatCount="indefinite"/>
    </g>

    <!-- 后轮 -->
    <g transform="translate(270,380)">
      <circle r="58" fill="none" stroke="#222" stroke-width="9"/>
      <circle r="47" fill="none" stroke="#8a8a95" stroke-width="3"/>
      <g stroke="#9a9aa5" stroke-width="2">
        <line x1="-47" y1="0" x2="47" y2="0"/>
        <line x1="-23.5" y1="-40.7" x2="23.5" y2="40.7"/>
        <line x1="-23.5" y1="40.7" x2="23.5" y2="-40.7"/>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="0.8s" repeatCount="indefinite"/>
      </g>
      <circle r="6" fill="#333"/>
    </g>

    <!-- 前轮 -->
    <g transform="translate(490,380)">
      <circle r="58" fill="none" stroke="#222" stroke-width="9"/>
      <circle r="47" fill="none" stroke="#8a8a95" stroke-width="3"/>
      <g stroke="#9a9aa5" stroke-width="2">
        <line x1="-47" y1="0" x2="47" y2="0"/>
        <line x1="-23.5" y1="-40.7" x2="23.5" y2="40.7"/>
        <line x1="-23.5" y1="40.7" x2="23.5" y2="-40.7"/>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="0.8s" repeatCount="indefinite"/>
      </g>
      <circle r="6" fill="#333"/>
    </g>

    <!-- 链条 -->
    <path d="M270 376 L368 374" stroke="#444" stroke-width="4" fill="none"/>
    <path d="M270 386 L368 400" stroke="#444" stroke-width="4" fill="none"/>

    <!-- 车架 -->
    <g stroke="#e63946" stroke-width="7" fill="none" stroke-linecap="round">
      <path d="M270 380 L370 388"/>
      <path d="M370 388 L335 285"/>
      <path d="M370 388 L470 268"/>
      <path d="M335 288 L462 252"/>
      <path d="M270 380 L335 288"/>
      <path d="M470 268 L490 380"/>
      <path d="M462 250 L470 268"/>
    </g>

    <!-- 曲柄与脚踏 -->
    <circle cx="370" cy="388" r="17" fill="none" stroke="#555" stroke-width="3"/>
    <circle cx="370" cy="388" r="12" fill="#333"/>
    <path d="M370 388 L402 410" stroke="#333" stroke-width="6" stroke-linecap="round"/>
    <path d="M370 388 L340 366" stroke="#333" stroke-width="6" stroke-linecap="round"/>
    <line x1="392" y1="412" x2="414" y2="412" stroke="#222" stroke-width="7" stroke-linecap="round"/>
    <line x1="330" y1="368" x2="352" y2="368" stroke="#222" stroke-width="7" stroke-linecap="round"/>

    <!-- 车座 -->
    <line x1="335" y1="285" x2="330" y2="270" stroke="#333" stroke-width="5"/>
    <ellipse cx="326" cy="266" rx="22" ry="8" fill="#2f2f3a"/>

    <!-- 车把 -->
    <path d="M462 250 L458 232" stroke="#333" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M448 230 L472 225" stroke="#333" stroke-width="7" fill="none" stroke-linecap="round"/>

    <!-- ===== 牛魔王 ===== -->
    <g>
      <!-- 尾巴 -->
      <path d="M308 262 C285 268 272 285 274 305" stroke="#4b4b5e" stroke-width="8" fill="none" stroke-linecap="round"/>
      <circle cx="274" cy="308" r="9" fill="#4b4b5e"/>

      <!-- 后腿 -->
      <path d="M328 276 C346 305 350 338 342 362" stroke="#3a3a4a" stroke-width="16" fill="none" stroke-linecap="round"/>
      <ellipse cx="338" cy="368" rx="12" ry="7" fill="#20202a"/>

      <!-- 后臂 -->
      <path d="M400 208 L445 228" stroke="#3a3a4a" stroke-width="14" fill="none" stroke-linecap="round"/>

      <!-- 躯干（蓝袍） -->
      <line x1="330" y1="272" x2="405" y2="198" stroke="#3f7fd6" stroke-width="40" stroke-linecap="round"/>
      <path d="M352 262 L380 236" stroke="#3568b0" stroke-width="5" stroke-linecap="round"/>

      <!-- 前腿 -->
      <path d="M332 272 C360 300 388 335 402 404" stroke="#3f7fd6" stroke-width="18" fill="none" stroke-linecap="round"/>
      <ellipse cx="406" cy="414" rx="13" ry="8" fill="#26262e"/>

      <!-- 脖子与牛头 -->
      <line x1="420" y1="190" x2="438" y2="168" stroke="#4b4b5e" stroke-width="18" stroke-linecap="round"/>
      <circle cx="445" cy="155" r="26" fill="#4b4b5e"/>
      <!-- 角 -->
      <path d="M428 136 Q410 112 428 92" stroke="#f0e6c8" stroke-width="9" fill="none" stroke-linecap="round"/>
      <path d="M462 132 Q482 106 504 102" stroke="#f0e6c8" stroke-width="9" fill="none" stroke-linecap="round"/>
      <!-- 耳朵 -->
      <path d="M420 142 Q402 134 396 148 Q404 158 418 154 Z" fill="#4b4b5e"/>
      <!-- 鼻口 -->
      <ellipse cx="472" cy="166" rx="15" ry="11" fill="#8a8a9a"/>
      <ellipse cx="469" cy="163" rx="2.5" ry="3.5" fill="#3a3a4a"/>
      <ellipse cx="478" cy="167" rx="2.5" ry="3.5" fill="#3a3a4a"/>
      <path d="M466 174 Q474 178 481 174" stroke="#3a3a4a" stroke-width="2" fill="none" stroke-linecap="round"/>
      <!-- 眼睛 -->
      <circle cx="452" cy="148" r="5.5" fill="#fff"/>
      <circle cx="453.5" cy="149" r="2.5" fill="#111"/>

      <!-- 红围巾 -->
      <path d="M396 196 L432 190 L430 208 L398 214 Z" fill="#e63946"/>
      <path d="M398 208 C378 214 366 228 362 246 L376 250 C380 232 390 218 404 212 Z" fill="#d02f3e"/>

      <!-- 前臂 -->
      <path d="M400 208 L452 228" stroke="#3f7fd6" stroke-width="16" fill="none" stroke-linecap="round"/>
      <circle cx="456" cy="229" r="8" fill="#4b4b5e"/>
    </g>
  </svg>
</div>
</body>
</html>
